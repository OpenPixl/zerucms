# =============================================================================
#  Réglages du site
# =============================================================================
#
#  Couleurs, bouton « Adhérer », lien « Je participe », outils de partage
#  et ouverture/fermeture des formulaires en ligne.
#
#  Ce fichier appartient à l'association : une mise à jour du site ne le
#  remplace jamais. Tout est facultatif : supprimez une ligne pour revenir à la
#  valeur par défaut du site. Une clé mal orthographiée fait échouer la
#  construction du site avec un message indiquant laquelle.
#
#  Les pages du site (Accueil, Activités, Actualités, Contact) ne se règlent
#  pas ici mais dans l'Espace Admin, module « Pages ».
# =============================================================================

# Couleurs du site, au format '#2f7fc1' (entre apostrophes).
#   primary    couleur principale : liens, boutons, titres mis en avant
#   secondary  couleur secondaire : pied de page, survols
#   accent     couleur d'accent : bouton « Adhérer », touches de couleur
#   stripe     bande de couleurs sous l'en-tête (autant de couleurs que voulu)
#   stripeEnabled  false = pas de bande (une ombre souligne alors l'en-tête)
# Pensez au contraste : du texte blanc doit rester lisible sur ces couleurs.
# Modèle neutre, noir et blanc : à remplacer par les couleurs de la structure
# (Espace Admin → Paramètres → Association → Charte graphique).
colors:
  primary: '#2e2e2e'
  secondary: '#2e2e2e'
  accent: '#2e2e2e'
  stripe: ['#2e2e2e']
  stripeEnabled: false

# Bouton mis en avant à droite de la barre de navigation.
# enabled: false pour le masquer.
cta:
  label: 'Adhérer'
  href: '/adherer'
  enabled: true

# Lien rapide « Je participe » (présence pendant un atelier), affiché sur
# téléphone et tablette uniquement. enabled: false pour le masquer.
presence:
  label: 'Je participe'
  href: '/je-participe'
  enabled: true

# Outils de partage en bas des actualités et des pages (true / false).
share:
  facebook: true
  copy: true # « Copier le lien »

# Plugins : volets du site à activer ou non (true / false). Tous inactifs
# sur un site neuf : on les choisit dans l'assistant d'installation, puis
# dans le module « Plugins » de l'Espace Admin. Changer une valeur demande
# de reconstruire le site.
#   adhesion    → adhésion en ligne et bulletin PDF, « Je participe »,
#                 planning lu dans Grist
#   inscription → /inscription et bouton « S'inscrire » des activités
#                 (requiert adhesion : inactive aussi sans elle)
# Développements propres à une structure : extensions (module « Extensions »),
# pas des plugins.
plugins: {adhesion: false, inscription: false}

# Formulaires en ligne. enabled: false ferme le formulaire : à sa place
# s'affiche un encart avec closedTitle et closedMessage.
#   adhesion               → /adherer/formulaire
#   contact                → /contact
#   inscription            → /inscription (inscription à une activité)
forms:
  adhesion:
    enabled: true
    closedTitle: 'Adhésions en ligne momentanément fermées'
    closedMessage: "Le formulaire d'adhésion en ligne n'est pas ouvert actuellement. Vous pouvez adhérer sur place ou nous écrire, nous vous répondrons rapidement."
  contact:
    enabled: true
    closedTitle: 'Formulaire de contact indisponible'
    closedMessage: "Le formulaire de contact n'est pas ouvert actuellement. Vous pouvez nous joindre par téléphone ou par e-mail (coordonnées ci-contre)."
  inscription:
    enabled: true
    closedTitle: 'Inscriptions en ligne momentanément fermées'
    closedMessage: "Le formulaire d'inscription en ligne n'est pas ouvert actuellement. Vous pouvez nous contacter directement pour vous inscrire à une activité."
