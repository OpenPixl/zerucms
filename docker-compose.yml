services:
  web:
    # Image publiée du modèle, version choisie par NUMERIK_VERSION dans le .env
    # (écrit par ./update.sh ; défaut : la dernière). Jamais construite ici :
    # tester une image locale = `docker build -t ghcr.io/openpixl/zerucms:local .`
    # puis `NUMERIK_VERSION=local docker compose up` (cf. docs/developpement.md).
    image: ghcr.io/openpixl/zerucms:${NUMERIK_VERSION:-latest}
    container_name: numerik2026
    restart: unless-stopped
    # Petit init (tini) en PID 1 : relaie les signaux d'arrêt à Node et
    # ramasse les processus orphelins (builds de publication).
    init: true

    # Secrets Grist (et autres) — fichier .env présent sur le VPS, hors dépôt
    env_file:
      - .env

    # Le conteneur n'est joignable qu'en local :
    # un reverse proxy (nginx / Traefik) gère le vrai domaine + HTTPS devant.
    ports:
      - "127.0.0.1:4321:4321"

    # Données de l'espace bénévoles hors contenu (comptes data/accounts, état
    # des publications data/publication) — cf. docs/auth.md. Le dossier ./data
    # du VPS survit aux redéploiements : à sauvegarder.
    environment:
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      # Contenu du site (pages, actualités, réglages…), propre à chaque
      # structure et jamais suivi par git : écrit par l'Espace Admin, conservé
      # d'une version à l'autre. À sauvegarder (module « Sauvegardes » ou
      # ./sauvegarde.sh). Cf. docs/publication.md.
      - ./src/content:/app/src/content
      # Versions construites du site : gardées d'un conteneur à l'autre, pour
      # que ./update.sh construise la nouvelle version AVANT de remplacer le
      # conteneur (bascule en quelques secondes, cf. docs/mise-a-jour.md).
      - ./.releases:/app/.releases
